<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://www.lrcstudio.app/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LRC Studio — Sync Lyrics to Music, Perfectly</title>
    <meta name="description" content="Sync lyrics to any song with tap-to-timestamp editing. Export .lrc, .srt, or word-level karaoke files. Free, browser-based, no install needed." />
    <meta name="theme-color" content="#232136" />

    <!-- Default Open Graph / Twitter card. proxy.ts replaces these per-route for
         crawlers; these are the fallback for any crawler reaching a path outside
         its matcher, and for a plain static build.
         NOTE: og:url intentionally matches the <link rel="canonical"> above.
         Both use www.lrcstudio.app. www is the canonical host: the apex
         308-redirects to it, so pointing canonical at the apex advertised a URL
         that immediately redirects. -->
    <meta property="og:site_name" content="LRC Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LRC Studio — Sync Lyrics to Music, Perfectly" />
    <meta property="og:description" content="Sync lyrics to any song and export .lrc, .srt or word-level karaoke files." />
    <meta property="og:url" content="https://www.lrcstudio.app/" />
    <meta property="og:logo" content="https://www.lrcstudio.app/favicon.svg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_CO" />
    <meta property="og:image" content="https://www.lrcstudio.app/og-default.png" />
    <meta property="og:image:secure_url" content="https://www.lrcstudio.app/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LRC Studio — sync lyrics to music, perfectly." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LRC Studio — Sync Lyrics to Music, Perfectly" />
    <meta name="twitter:description" content="Sync lyrics to any song and export .lrc, .srt or word-level karaoke files." />
    <meta name="twitter:image" content="https://www.lrcstudio.app/og-default.png" />
    <meta name="twitter:image:alt" content="LRC Studio — sync lyrics to music, perfectly." />
    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LRC Studio",
      "url": "https://www.lrcstudio.app",
      "description": "Sync lyrics to any song with tap-to-timestamp editing. Export .lrc, .srt, or word-level karaoke files. Free, browser-based, no install needed.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern web browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Tap-to-timestamp lyric sync",
        "Word-level karaoke timing",
        "LRC file export",
        "SRT subtitle export",
        "YouTube audio support",
        "Live karaoke preview"
      ]
    }
    </script>
    <!-- Web fonts are self-hosted (see the @fontsource imports in src/index.css), so
         there is no font stylesheet request here and nothing to preconnect to. They
         used to be fetched from fonts.googleapis.com, which put a second
         render-blocking stylesheet in front of every font file. -->
    <!-- First-paint theme seed: mirrors useThemeSync so there's no dark→light flash.
         New users (no stored theme) are seeded from the OS color scheme; the in-app
         theme switcher still wins once it loads. Falls back to the html `dark` class. -->
    <script>
      (function () {
        try {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = null;
          var raw = localStorage.getItem('lrc-syncer-settings');
          if (raw) {
            var s = JSON.parse(raw);
            theme = (s && s.interface && s.interface.theme) || (s && s.theme) || null;
          }
          if (!theme) theme = prefersDark ? 'dark' : 'light'; // brand-new user → follow OS
          var root = document.documentElement;
          // Type weight ramp, seeded here too so the first paint is not a frame
          // of the default weights before useThemeSync runs.
          var weight = raw ? (JSON.parse(raw).interface || {}).fontWeight : null;
          if (weight && weight !== 'normal') root.setAttribute('data-font-weight', weight);
          root.classList.remove('dark', 'theme-cobalt', 'theme-velvet', 'theme-sage');
          if (theme === 'light') { /* no classes */ }
          else if (theme === 'cobalt') root.classList.add('dark', 'theme-cobalt');
          else if (theme === 'velvet') root.classList.add('dark', 'theme-velvet');
          else if (theme === 'sage') root.classList.add('dark', 'theme-sage');
          else if (theme === 'system') { if (prefersDark) root.classList.add('dark'); }
          else root.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

    <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
