<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LRC Studio">
  <!-- Brand mark alone on a transparent canvas: same geometry as src/shared/ui/logo-geometry.ts.
       A dragonfly: the playhead is the body, synced lines the filled wing, upcoming lines the outlined one. -->
  <style>
    :root { --iris: #c4a7e7; --gold: #f6c177; --ink: #e0def4; }
    @media (prefers-color-scheme: light) {
      :root { --iris: #907aa9; --gold: #ea9d34; --ink: #575279; }
    }
  </style>
  <g fill="var(--iris)"><rect x="4" y="13" width="24" height="5.5" rx="2.75"/><rect x="7" y="21" width="21" height="5.5" rx="2.75"/><rect x="12" y="29" width="16" height="5.5" rx="2.75"/></g>
  <g fill="none" stroke="var(--iris)" stroke-width="1.8"><rect x="36.9" y="13.9" width="22.2" height="3.7" rx="1.85"/><rect x="36.9" y="21.9" width="14.2" height="3.7" rx="1.85"/><rect x="36.9" y="29.9" width="7.2" height="3.7" rx="1.85"/></g>
  <g fill="var(--gold)"><circle cx="32" cy="7" r="4.5"/><rect x="30.25" y="12" width="3.5" height="24.5" rx="1.75"/><circle cx="32" cy="40.5" r="2"/><circle cx="32" cy="46.5" r="1.8"/><circle cx="32" cy="52" r="1.6"/><circle cx="32" cy="57" r="1.4"/><circle cx="32" cy="61.5" r="1.2"/></g>
</svg>
