<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: light) {
      :root { --bg: #faf4ed; --iris: #907aa9; --gold: #ea9d34; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #232136; --iris: #c4a7e7; --gold: #f6c177; }
    }
    rect.bg { fill: var(--bg, #232136); }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <!-- Playhead over lyric lines — brand mark (see src/shared/ui/LogoMark.tsx) -->
  <g fill="var(--iris, #c4a7e7)">
    <rect x="3" y="6" width="12" height="4" rx="2"/>
    <rect x="3" y="13" width="12" height="4" rx="2"/>
    <rect x="3" y="20" width="12" height="4" rx="2"/>
  </g>
  <g fill="var(--iris, #c4a7e7)" opacity="0.3">
    <rect x="18" y="6" width="7" height="4" rx="2"/>
    <rect x="18" y="13" width="11" height="4" rx="2"/>
    <rect x="18" y="20" width="4" height="4" rx="2"/>
  </g>
  <rect x="15.5" y="4.5" width="1.75" height="24" rx="0.875" fill="var(--gold, #f6c177)"/>
  <circle cx="16.375" cy="2.5" r="2" fill="var(--gold, #f6c177)"/>
</svg>
