<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root { --iris: #c4a7e7; --gold: #f6c177; }
    @media (prefers-color-scheme: light) {
      :root { --iris: #907aa9; --gold: #ea9d34; }
    }
  </style>
  <!-- Dragonfly brand mark on a transparent canvas, so it sits directly on the browser's tab
       strip. Small-size cut of src/shared/ui/logo-geometry.ts for 16px: heavier bars, body and
       tail, and the upcoming (right) wing as a faded fill, since an outline would be a hairline. -->
  <g fill="var(--iris)"><rect x="2" y="11" width="26" height="7" rx="3.5"/><rect x="6" y="19.5" width="22" height="7" rx="3.5"/><rect x="12" y="28" width="16" height="7" rx="3.5"/></g>
  <g fill="var(--iris)" opacity="0.5"><rect x="36" y="11" width="26" height="7" rx="3.5"/><rect x="36" y="19.5" width="17" height="7" rx="3.5"/><rect x="36" y="28" width="10" height="7" rx="3.5"/></g>
  <g fill="var(--gold)"><circle cx="32" cy="6.5" r="5.5"/><rect x="29.5" y="12" width="5" height="25" rx="2.5"/><circle cx="32" cy="42.5" r="2.7"/><circle cx="32" cy="49.5" r="2.4"/><circle cx="32" cy="55.5" r="2.1"/><circle cx="32" cy="61" r="1.8"/></g>
</svg>
