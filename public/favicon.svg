<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root { --bg: #232136; --iris: #c4a7e7; --gold: #f6c177; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #faf4ed; --iris: #907aa9; --gold: #ea9d34; }
    }
  </style>
  <rect fill="var(--bg)" width="64" height="64" rx="12"/>
  <!-- Dragonfly brand mark (see src/shared/ui/logo-geometry.ts). Small-size cut: at 16px the
       outlined right wing would be a hairline, so here it is a faded fill instead. -->
  <g transform="translate(1.6 1.6) scale(0.95)">
    <g fill="var(--iris)"><rect x="4" y="13" width="24" height="5.5" rx="2.75"/><rect x="7" y="21" width="21" height="5.5" rx="2.75"/><rect x="12" y="29" width="16" height="5.5" rx="2.75"/></g>
    <g fill="var(--iris)" opacity="0.45"><rect x="36" y="13" width="24" height="5.5" rx="2.75"/><rect x="36" y="21" width="16" height="5.5" rx="2.75"/><rect x="36" y="29" width="9" height="5.5" rx="2.75"/></g>
    <g fill="var(--gold)"><circle cx="32" cy="7" r="4.5"/><rect x="30.25" y="12" width="3.5" height="24.5" rx="1.75"/><circle cx="32" cy="40.5" r="2"/><circle cx="32" cy="46.5" r="1.8"/><circle cx="32" cy="52" r="1.6"/><circle cx="32" cy="57" r="1.4"/><circle cx="32" cy="61.5" r="1.2"/></g>
  </g>
</svg>
